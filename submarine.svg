<svg viewBox="0 0 180 96" xmlns="http://www.w3.org/2000/svg" style="width:100%">
  <!-- The site's mascot, at 16px. Same viewBox, same silhouette and the same
       paint ramp as the inline submersible in index.html, with everything
       that would land under one pixel taken out: no seams, no grime, no
       specular, one lamp, flat glass.

       Colours are literal sRGB here and not var() references to the sub
       tokens, on purpose. A favicon is rendered as a standalone document
       with no page to inherit custom properties from, so a var() reference
       would resolve to nothing and paint black. These are the same tokens,
       converted once. If the hull palette in index.html moves, move these
       with it. -->
  <defs>
    <linearGradient id="paint" gradientUnits="userSpaceOnUse" x1="0" y1="27.5" x2="0" y2="77">
      <stop offset="0" stop-color="#f5eac1"/>
      <stop offset="0.08" stop-color="#eace66"/>
      <stop offset="0.42" stop-color="#cfac30"/>
      <stop offset="0.66" stop-color="#9e7e34"/>
      <stop offset="0.84" stop-color="#56442c"/>
      <stop offset="1" stop-color="#11202b"/>
    </linearGradient>
    <linearGradient id="sail" gradientUnits="userSpaceOnUse" x1="0" y1="15.5" x2="0" y2="33">
      <stop offset="0" stop-color="#eace66"/>
      <stop offset="0.5" stop-color="#cfac30"/>
      <stop offset="1" stop-color="#9e7e34"/>
    </linearGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="84">
      <stop offset="0" stop-color="#626a72"/>
      <stop offset="0.62" stop-color="#1d2228"/>
      <stop offset="1" stop-color="#1d2228"/>
    </linearGradient>
  </defs>

  <!-- skid frame, tail fins, thruster shroud -->
  <path d="M63 79.2h50v2.6H63ZM68.6 70.8h2.9L68 80h-2.9ZM105.4 70L108.3 70L111.6 80h-2.9Z" fill="url(#metal)"/>
  <path d="M38 40L25.6 26.6L21.6 28.8L30 42ZM38 64L25.6 77.4L21.6 75.2L30 62ZM17 49.4h10v5.2H17Z" fill="url(#metal)"/>
  <ellipse cx="15.4" cy="52" rx="4.6" ry="10.6" fill="url(#metal)"/>
  <ellipse cx="16.2" cy="52" rx="2.9" ry="8.4" fill="#000103"/>

  <!-- mast and sail -->
  <path d="M76.4 7.2h3v12.6h-3ZM72.4 7.4h11v2.6h-11Z" fill="url(#metal)"/>
  <path d="M58.6 31.8C59.6 25.2 63.8 20.2 71.2 18C79 15.7 92 15.8 100 18.2C108 20.6 112.6 25.8 113.6 31.8Z" fill="url(#sail)"/>

  <!-- hull -->
  <path d="M22.5 52C24.4 41.2 37.2 31.6 60 29.7C82 27.9 111 29.3 129 33.7C141 36.6 149.5 43.5 150.6 52C149.5 60.5 141 67.4 129 70.3C111 74.7 82 76.1 60 74.3C37.2 72.4 24.4 62.8 22.5 52Z" fill="url(#paint)"/>

  <!-- viewports -->
  <circle cx="97" cy="51" r="8.4" fill="url(#metal)"/>
  <circle cx="97" cy="51" r="6.4" fill="#03101a"/>
  <circle cx="68" cy="51.5" r="6.4" fill="url(#metal)"/>
  <circle cx="68" cy="51.5" r="4.7" fill="#03101a"/>

  <!-- lamp -->
  <path d="M136.4 47.6C136.4 45.8 137.6 45 139.4 45h9.6v14h-9.6c-1.8 0-3-0.8-3-2.6Z" fill="url(#metal)"/>
  <circle cx="150.2" cy="52" r="6.9" fill="#1d2228"/>
  <circle cx="150.4" cy="52" r="4.7" fill="#fdcf6f"/>
  <circle cx="150.8" cy="51.6" r="1.9" fill="#fffbd9"/>
</svg>
